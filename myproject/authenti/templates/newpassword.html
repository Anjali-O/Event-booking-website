{% extends 'main.html' %}
{% block content %}

<div class="center-forgot">
    <div class="forgot-card">
        <h2 class="page-title">Reset Password</h2>

        {% if error %}
        <h2 class="status-msg">The new password cannot be the same as the old password.</h2>
        {% endif %}

        <form action="" method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="newpass" class="form-label">New Password</label>
                <input type="text" id="newpass" name="newpass" class="form-input" placeholder="Enter your new password">
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>
</div>

{% endblock %}
